<!DOCTYPE html>
<html>
<head>
    <title>PisoNet Admin Dashboard</title>
    <style>
        body { font-family: Arial; background: #222; color: white; }
        .container { max-width: 1200px; margin: auto; padding: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border: 1px solid #444; }
    </style>
</head>
<body>
    <div class="container">
        <h1>PisoNet Admin Dashboard</h1>
        <h2>Active Sessions</h2>
        <table>
            <tr><th>Client ID</th><th>Status</th><th>Time Remaining</th></tr>
            {% for session in sessions %}
            <tr><td>{{ session.client_id }}</td><td>{{ session.status }}</td><td>{{ session.time_remaining }}</td></tr>
            {% endfor %}
        </table>
        <h2>Sales</h2>
        <ul>
            {% for sale in sales %}
            <li>{{ sale.timestamp }}: {{ sale.revenue }}</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
